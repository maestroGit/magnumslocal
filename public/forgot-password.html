<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>Recuperar contraseña - BlocksWine</title>
  <link rel="stylesheet" type="text/css" href="base.css">
  <link rel="stylesheet" type="text/css" href="styles.css">
  <style>
    .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .auth-card { width: 100%; max-width: 440px; background: #fff; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.08); padding: 24px; }
    .auth-card h1 { margin: 0 0 12px; font-size: 1.4rem; }
    .auth-card p { margin: 0 0 16px; color: #4a5568; }
    .auth-form { display: grid; gap: 10px; }
    .auth-form input { padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 8px; }
    .auth-form button { padding: 11px 12px; border: 0; border-radius: 8px; background: #1f2937; color: #fff; cursor: pointer; }
    .auth-message { margin-top: 10px; min-height: 20px; font-size: .95rem; color: #1f2937; }
    .auth-actions { margin-top: 16px; font-size: .92rem; }
    .auth-actions a { color: #4a5568; text-decoration: none; }
    .auth-actions a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="forgot-title">
      <h1 id="forgot-title">Recuperar contraseña</h1>
      <p>Introduce tu email y te enviaremos un enlace de recuperación.</p>
      <form id="forgot-password-form" class="auth-form" novalidate>
        <label for="forgot-email">Email</label>
        <input id="forgot-email" name="email" type="email" autocomplete="email" required>
        <button type="submit">Enviar enlace</button>
      </form>
      <div id="forgot-message" class="auth-message" role="status" aria-live="polite"></div>
      <div class="auth-actions">
        <a href="/login.html">Volver al login</a>
      </div>
    </section>
  </main>
  <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
