<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>Restablecer contraseña - BlocksWine</title>
  <link rel="stylesheet" type="text/css" href="base.css">
  <link rel="stylesheet" type="text/css" href="styles.css">
  <style>
    .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .auth-card { width: 100%; max-width: 460px; background: #fff; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.08); padding: 24px; }
    .auth-card h1 { margin: 0 0 12px; font-size: 1.4rem; }
    .auth-card p { margin: 0 0 16px; color: #4a5568; }
    .auth-form { display: grid; gap: 10px; }
    .auth-form input { padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 8px; }
    .auth-form button { padding: 11px 12px; border: 0; border-radius: 8px; background: #1f2937; color: #fff; cursor: pointer; }
    .auth-message { margin-top: 10px; min-height: 20px; font-size: .95rem; }
    .auth-message.error { color: #b91c1c; }
    .auth-message.success { color: #166534; }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="reset-title">
      <h1 id="reset-title">Restablecer contraseña</h1>
      <p>Introduce una nueva contraseña segura.</p>
      <form id="reset-password-form" class="auth-form" novalidate>
        <label for="new-password">Nueva contraseña</label>
        <input id="new-password" name="newPassword" type="password" autocomplete="new-password" required>
        <label for="new-password-confirm">Confirmar contraseña</label>
        <input id="new-password-confirm" name="newPasswordConfirm" type="password" autocomplete="new-password" required>
        <button type="submit">Actualizar contraseña</button>
      </form>
      <div id="reset-message" class="auth-message" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
